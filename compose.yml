services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_DB: neurolens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      NEUROLENS_DB_PASSWORD: ${NEUROLENS_DB_PASSWORD:?Required}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d neurolens" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
